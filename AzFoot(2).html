<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sabah FK — матчи 2026/27</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#fff;color:#000;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none}
ul{list-style:none}
.page{position:relative;min-height:100vh;background:#fff;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:16px;pointer-events:none}
.nav>*{pointer-events:auto}
.nav-left,.nav-right,.logo{display:flex;align-items:center;gap:8px}
.brand{display:none;font-weight:600;font-size:15px;letter-spacing:-0.02em}
.menu{display:flex;align-items:center;gap:8px;background:#000;color:#fff;border-radius:999px;padding:3px 12px 3px 3px;font-size:11px}
.menu-dot,.circle{width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.menu-dot{background:#fff}
.tags-pill{display:none;background:#F4F4F6;border-radius:999px;padding:8px 16px;gap:16px;font-size:11px;color:rgba(0,0,0,.7)}
.right-pill{display:flex;align-items:center;gap:8px;background:#F4F4F6;border-radius:999px;padding:3px}
.circle{background:#000;width:28px;height:28px}
.right-label{display:none;font-size:11px;padding-right:12px;color:rgba(0,0,0,.7)}
.video-wrap{position:absolute;inset:0;z-index:0;display:flex;align-items:center;justify-content:center}
.video-inner{width:80%;height:80%}
.video-inner video{width:100%;height:100%;object-fit:cover}
.spacer{flex:1}
.footer{position:relative;z-index:30;display:flex;flex-direction:column;gap:20px;padding:80px 16px 24px;background:linear-gradient(to top,#ffffff 0%,rgba(255,255,255,.8) 50%,transparent 100%)}
.subtitle{display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(0,0,0,.55);margin-bottom:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#000;display:block}
h1{font-weight:300;font-size:clamp(2rem,8vw,4.5rem);letter-spacing:-0.03em;line-height:1}
.btns{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{font-size:13px;padding:10px 20px;border-radius:999px}
.solid{background:#000;color:#fff}
.ghost{border:1px solid rgba(0,0,0,.35);color:#000}
.foot-right{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#fff;border:1px solid rgba(0,0,0,.12);border-radius:999px;padding:6px 14px;font-size:11px}
.matches{max-width:880px;margin:0 auto;padding:72px 16px 48px}
.matches h2{font-weight:300;font-size:clamp(1.8rem,5vw,2.8rem);letter-spacing:-0.03em;margin-bottom:24px}
.tabs{display:flex;gap:8px;margin-bottom:24px}
.tab{font-size:13px;padding:8px 18px;border-radius:999px;background:#F4F4F6;color:rgba(0,0,0,.7)}
.tab.on{background:#000;color:#fff}
.row{display:grid;grid-template-columns:96px 1fr;gap:4px 12px;padding:16px 0;border-top:1px solid rgba(0,0,0,.1);font-size:14px}
.date{font-weight:500}
.comp,.note{font-size:11px;color:rgba(0,0,0,.5)}
.teams{grid-column:1/-1;display:flex;align-items:center;gap:12px}
.teams b{font-weight:400;flex:1}
.teams b:first-child{text-align:right}
.teams .us{font-weight:600}
.score{min-width:64px;text-align:center;padding:4px 10px;border-radius:8px;font-weight:600;background:#F4F4F6}
.score.win{background:#000;color:#fff}
.score.loss{border:1px solid #000}
.score.next{color:rgba(0,0,0,.45);font-weight:400}
.note{grid-column:1/-1}
.foot-note{margin-top:24px;font-size:11px;color:rgba(0,0,0,.45)}
.arch{max-width:880px;margin:0 auto;padding:0 16px 72px}
.arch h2{font-weight:300;font-size:clamp(1.8rem,5vw,2.8rem);letter-spacing:-0.03em;margin-bottom:8px}
.arch>p{font-size:13px;color:rgba(0,0,0,.55);margin-bottom:20px}
.card{border-top:1px solid rgba(0,0,0,.1);padding:18px 0;display:grid;gap:6px}
.card b{font-weight:600;font-size:15px}
.card span{font-size:14px;color:rgba(0,0,0,.75);line-height:1.5}
.card a{font-size:12px;color:#000;font-weight:500}
.lang{display:flex;background:#F4F4F6;border-radius:999px;padding:3px;gap:2px;margin-right:8px}
.lang button{font-size:11px;font-weight:500;padding:5px 9px;border-radius:999px;color:rgba(0,0,0,.6)}
.lang button.on{background:#000;color:#fff}
.nav-right{display:flex;align-items:center}
.tixbtn{grid-column:1/-1;justify-self:start;font-size:12px;padding:6px 14px;border-radius:999px;background:#000;color:#fff}
.tix{grid-column:1/-1;display:none;background:#F4F4F6;border-radius:14px;padding:14px 16px;font-size:13px;gap:8px;flex-direction:column}
.tix.open{display:flex}
.tix a{color:#000;font-weight:500}
.tix small{color:rgba(0,0,0,.55);display:block;font-size:11px;font-weight:400}
.squad{max-width:880px;margin:0 auto;padding:24px 16px 72px}
.squad h2{font-weight:300;font-size:clamp(1.8rem,5vw,2.8rem);letter-spacing:-0.03em;margin-bottom:8px}
.coach{font-size:13px;color:rgba(0,0,0,.55);margin-bottom:24px}
.pos{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(0,0,0,.5);margin:24px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pl{border:1px solid rgba(0,0,0,.12);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px}
.pl .n{font-size:22px;font-weight:300;letter-spacing:-0.03em}
.pl .nm{font-size:14px;font-weight:500}
.pl .mv{font-size:12px;font-weight:500;margin-top:6px}
.pl .meta{font-size:11px;color:rgba(0,0,0,.5)}
#home,#table{min-height:100vh}
.topbar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:16px;background:linear-gradient(#fff 60%,transparent)}
.hw{max-width:880px;margin:0 auto;padding:110px 16px 64px}
#clubs{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));margin-top:36px}
.club{text-align:left;background:#fff;transition:background .2s}.club:hover{background:#F4F4F6}
.mono{width:36px;height:36px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;font-size:12px;margin-bottom:12px}
.club .nm{font-size:17px}
.tw{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11px;font-weight:500;color:rgba(0,0,0,.5);padding:8px 6px;text-align:center}
.tbl td{padding:12px 6px;text-align:center;border-top:1px solid rgba(0,0,0,.1)}
.tbl .l{text-align:left}.tbl td.l button{font-weight:500;text-align:left}.tbl .pts{font-weight:600}.tbl tr.me td{background:#F4F4F6}
@media (min-width:768px){
 .nav{padding:24px 32px}
 .nav-left{gap:12px}
 .brand,.right-label{display:inline}
 .tags-pill{display:flex}
 .menu-dot{width:26px;height:26px}
 .circle{width:32px;height:32px}
 .video-inner{width:100%;height:100%}
 .footer{flex-direction:row;justify-content:space-between;align-items:flex-end;padding:120px 32px 32px}
 h1{font-size:clamp(2.5rem,5.5vw,4.5rem)}
 .row{grid-template-columns:110px 200px 1fr 150px;align-items:center}
 .teams{grid-column:auto}
 .note{grid-column:auto;text-align:right}
}
.best{max-width:880px;margin:0 auto;padding:24px 16px 72px}
.best h2{font-weight:300;font-size:clamp(1.8rem,5vw,2.8rem);letter-spacing:-0.03em;margin-bottom:8px}
#bestlist{list-style:none;padding:0;margin:20px 0 0;display:flex;flex-direction:column;gap:8px}
.brow{display:flex;align-items:center;gap:16px;border:1px solid rgba(0,0,0,.12);border-radius:14px;padding:14px 18px}
.brow .rk{font-size:26px;font-weight:300;letter-spacing:-0.03em;width:40px}
.brow .bi{flex:1;display:flex;flex-direction:column;gap:2px}
.brow .bn{font-size:15px;font-weight:500}
.brow .bc{font-size:11px;color:rgba(0,0,0,.5)}
.brow .bv{font-size:14px;font-weight:500;white-space:nowrap}
.brow.top{background:#000;color:#fff;border-color:#000}
.brow.top .bc{color:rgba(255,255,255,.6)}

.game{max-width:880px;margin:0 auto;padding:24px 16px 72px}
.game h2{font-weight:300;font-size:clamp(1.8rem,5vw,2.8rem);letter-spacing:-0.03em;margin-bottom:8px}
.gbar{display:flex;align-items:center;justify-content:space-between;margin:16px 0 10px;font-size:14px}
.gdots{display:flex;gap:8px}
.gdots i{width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(0,0,0,.3);display:block}
.gdots i.g{background:#1a9a4b;border-color:#1a9a4b}.gdots i.m{background:#d33;border-color:#d33}
.stage{position:relative;height:300px;border-radius:18px;overflow:hidden;background:linear-gradient(#2e9e55,#237a42);user-select:none;cursor:crosshair;touch-action:manipulation}
.goal{position:absolute;top:22px;left:15%;width:70%;height:120px;border:4px solid #fff;border-bottom:none;background:repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 2px,transparent 2px 10px)}
.keeper{position:absolute;top:62px;left:50%;font-size:46px;transform:translateX(-50%);transition:left .35s ease-out,transform .35s ease-out;line-height:1}
.keeper.L{left:22%;transform:translateX(-50%) rotate(-50deg)}.keeper.R{left:78%;transform:translateX(-50%) rotate(50deg)}
.ball{position:absolute;left:50%;top:238px;font-size:30px;transform:translateX(-50%);transition:left .45s ease-in,top .45s ease-in;line-height:1}
.ball.L{left:26%;top:92px}.ball.R{left:74%;top:92px}
.gmsg{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#fff;font-weight:500;font-size:22px;text-shadow:0 1px 6px rgba(0,0,0,.4);min-height:30px}
.gctl{display:flex;gap:10px;margin-top:12px}.gctl .btn{flex:1}

.pack{max-width:880px;margin:0 auto;padding:24px 16px 72px}
.pack h2{font-weight:300;font-size:clamp(1.8rem,5vw,2.8rem);letter-spacing:-0.03em;margin-bottom:8px}
.pk-wrap{display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:20px}
.pk{width:190px;height:260px;border-radius:18px;border:none;cursor:pointer;color:#fff;font:inherit;background:linear-gradient(135deg,#0b0b0b 0 50%,#1e5bd8 50% 100%);box-shadow:0 12px 30px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:transform .2s}
.pk:hover{transform:translateY(-4px) rotate(-1deg)}
.pk b{font-size:22px;font-weight:500;letter-spacing:-.02em}.pk small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.pk.zoom{animation:pkz 1s ease-in-out;z-index:5;position:relative}
@keyframes pkz{0%{transform:scale(1)}25%{transform:scale(1.5) rotate(-5deg)}40%{transform:scale(1.6) rotate(5deg)}55%{transform:scale(1.7) rotate(-4deg);box-shadow:0 0 60px 20px rgba(255,215,0,.7)}80%{transform:scale(1.9);box-shadow:0 0 120px 60px rgba(255,255,255,.95);filter:brightness(1.6)}100%{transform:scale(1)}}
.pc .f .rt{font-size:38px;font-weight:600;letter-spacing:-.04em;line-height:1}
.pc .f .ps{font-size:10px;letter-spacing:.1em;opacity:.55}
.pc.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes pks{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(4deg)}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;width:100%}
.pc{height:200px;perspective:700px;cursor:pointer}
.pc>div{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.pc.up>div{transform:rotateY(180deg)}
.pc .f,.pc .b{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;text-align:center}
.pc .b{background:linear-gradient(135deg,#0b0b0b 0 50%,#1e5bd8 50% 100%);color:#fff;font-size:30px}
.pc .f{transform:rotateY(180deg);border:2px solid rgba(0,0,0,.15);background:#fff}
.pc .f .rr{font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.pc .f .pn{font-size:16px;font-weight:500;letter-spacing:-.01em}
.pc .f .pcl{font-size:12px;padding:3px 10px;border-radius:99px;color:#fff}
.pc .f .pcl.S{background:#1e5bd8}.pc .f .pcl.Q{background:#111}
.pc .f .pv{font-size:11px;color:rgba(0,0,0,.5)}
.pc.rare .f{border-color:#d9a400;background:linear-gradient(#fff8dc,#fff)}
.pc.leg .f{border-color:#8a3ffc;background:linear-gradient(#efe3ff,#fff);box-shadow:0 0 18px rgba(138,63,252,.5)}

.tkbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0 4px;padding:12px 16px;border:1px solid rgba(0,0,0,.12);border-radius:14px;font-size:15px}
.tkbar b{font-size:22px;font-weight:600}
.clkwrap{position:relative}
#clk:active{transform:scale(.94)}
.fl{position:absolute;right:14px;top:-4px;font-weight:600;color:#1a9a4b;pointer-events:none;animation:fl .8s forwards}
@keyframes fl{to{transform:translateY(-34px);opacity:0}}
.collh{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(0,0,0,.5);width:100%;margin-top:10px}
.coll{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.coll span{border:1px solid rgba(0,0,0,.15);border-radius:99px;padding:6px 12px;font-size:12px}
.coll span b{font-weight:600;margin-right:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex}
.mbox{background:#fff;border-radius:22px;padding:24px;width:min(320px,100%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;animation:mz .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes mz{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.mcard{width:220px;border-radius:18px;padding:22px 12px;border:3px solid rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff}
.mcard.rare{border-color:#d9a400;background:linear-gradient(#fff8dc,#fff)}
.mcard.leg{border-color:#8a3ffc;background:linear-gradient(#efe3ff,#fff);box-shadow:0 0 28px rgba(138,63,252,.5)}
.mcard .rt{font-size:64px;font-weight:600;letter-spacing:-.04em;line-height:1}
.mcard .pn{font-size:20px;font-weight:500}
.mcard .rr,.mcard .ps{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.6}
.mcard .pcl{font-size:12px;padding:3px 12px;border-radius:99px;color:#fff}.mcard .pcl.S{background:#1e5bd8}.mcard .pcl.Q{background:#111}
.mprice{font-size:18px;margin-top:6px}.mmsg{font-size:12px;color:#d33;min-height:16px}
.mbtns{display:flex;gap:8px;width:100%}.mbtns .btn{flex:1}
.btn[disabled]{opacity:.4;cursor:not-allowed}

.idx{max-width:880px;margin:0 auto;padding:24px 16px 72px}
.idx h2{font-weight:300;font-size:clamp(1.8rem,5vw,2.8rem);letter-spacing:-0.03em;margin-bottom:8px}
.ixpitch{position:relative;height:540px;border-radius:18px;overflow:hidden;background:linear-gradient(#2e9e55,#237a42);margin-top:16px;touch-action:none}
.ixz{position:absolute;left:0;right:0;height:33.34%;border-top:2px dashed rgba(255,255,255,.55);color:rgba(255,255,255,.85);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:8px 12px}
.ixz:first-child{border-top:none}
.ixbench{display:flex;flex-wrap:wrap;gap:10px;min-height:96px;padding:14px;border:1.5px dashed rgba(0,0,0,.25);border-radius:14px;margin-top:8px;align-items:center}
.ixbench em{font-size:12px;color:rgba(0,0,0,.5)}
.ixchip{width:62px;padding:7px 4px;border-radius:12px;background:#fff;border:2px solid #111;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:grab;user-select:none;touch-action:none;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.ixchip.S{border-color:#1e5bd8}.ixchip.Q{border-color:#111}
.ixchip b{font-size:20px;font-weight:600;letter-spacing:-.03em;line-height:1}
.ixchip span{font-size:10px;font-weight:500;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ixchip.onp{position:absolute;transform:translate(-50%,-50%)}
.ixchip.ghost{position:fixed!important;transform:translate(-50%,-50%) scale(1.15);pointer-events:none;z-index:70;cursor:grabbing}
#home .game,#home .pack,#home .idx,#home .best{scroll-margin-top:72px}
.modal{z-index:90}

/* ===== ANIMATIONS ===== */
:root{--ez:cubic-bezier(.16,1,.3,1)}
body{animation:fadein .6s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes fadedown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,0,0,.35)}70%{box-shadow:0 0 0 8px rgba(0,0,0,0)}100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}}
@keyframes legglow{0%,100%{box-shadow:0 0 14px rgba(138,63,252,.4)}50%{box-shadow:0 0 36px rgba(138,63,252,.95)}}
@keyframes rareglow{0%,100%{box-shadow:0 0 6px rgba(217,164,0,.3)}50%{box-shadow:0 0 22px rgba(217,164,0,.85)}}
@keyframes sheen{from{background-position:130% 0}to{background-position:-130% 0}}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -9px}}
@keyframes sway{0%,100%{translate:-16px 0}50%{translate:16px 0}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -6px}}
@keyframes flash{from{opacity:1}to{opacity:0}}
@keyframes shake{0%,100%{translate:0 0}20%{translate:-8px 0}40%{translate:7px 0}60%{translate:-5px 0}80%{translate:3px 0}}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.2);opacity:1}100%{transform:scale(1)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35);color:#1a9a4b}100%{transform:scale(1)}}
@keyframes dotpop{0%{transform:scale(.2)}60%{transform:scale(1.5)}100%{transform:scale(1)}}
@keyframes cardin{from{opacity:0;transform:translateY(40px) scale(.85)}to{opacity:1;transform:none}}
@keyframes chipin{from{scale:.3;opacity:0}60%{scale:1.15;opacity:1}to{scale:1}}
@keyframes cf{to{transform:translate(var(--dx),340px) rotate(var(--r));opacity:.9}}
@keyframes pitchglow{0%,100%{box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}50%{box-shadow:inset 0 0 0 3px rgba(255,255,255,.9)}}
@keyframes benchglow{0%,100%{border-color:rgba(0,0,0,.25)}50%{border-color:#1e5bd8}}

#prog{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#1e5bd8,#000);transform-origin:0 0;transform:scaleX(0);z-index:200;pointer-events:none}

/* переходы между экранами */
.vin .topbar{animation:fadedown .6s var(--ez) both}
#home.vin .hw .subtitle{animation:rise .8s var(--ez) .1s both}
#home.vin .hw h1{animation:rise .8s var(--ez) .2s both}
#home.vin .hw .btns{animation:rise .8s var(--ez) .35s both}
#table.vin .matches h2{animation:rise .7s var(--ez) .1s both}

/* ховеры */
.dot{animation:pulse 2s infinite}
.btn,.tab,.tixbtn,.menu,.circle,.chip,.lang button{transition:transform .2s var(--ez),background .2s,color .2s,box-shadow .2s,border-color .2s}
.btn:hover,.tab:hover,.tixbtn:hover,.menu:hover{transform:translateY(-2px)}
.btn.solid:hover,.tixbtn:hover{box-shadow:0 6px 16px rgba(0,0,0,.22)}
.btn.ghost:hover{background:#000;color:#fff;border-color:#000}
.btn:active,.tab:active,.tixbtn:active,.menu:active{transform:scale(.95)}
.btn[disabled]:hover{transform:none;box-shadow:none}
.circle:hover{transform:rotate(90deg)}
.chip:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.logo svg{transition:transform .5s var(--ez)}.logo:hover svg{transform:rotate(-20deg) scale(1.15)}
.row{transition:background .2s,padding-left .25s var(--ez)}.row:hover{background:#fafafa;padding-left:8px}
.pl{transition:transform .25s var(--ez),box-shadow .25s,background .2s}

.mono{transition:transform .35s var(--ez)}.club:hover .mono{transform:scale(1.15) rotate(-8deg)}
.tbl tbody tr{transition:background .2s}.tbl tbody tr:hover td{background:#F4F4F6}
.tbl td.l button{transition:letter-spacing .25s,transform .25s var(--ez)}.tbl td.l button:hover{transform:translateX(4px)}
.brow{transition:transform .25s var(--ez),box-shadow .25s}.brow:hover{transform:translateX(6px);box-shadow:0 6px 18px rgba(0,0,0,.1)}
.brow.top{background-image:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.2) 50%,transparent 65%);background-size:250% 100%;animation:sheen 3.2s linear infinite}
.card{transition:padding-left .25s var(--ez)}.card:hover{padding-left:8px}
.ixchip{transition:translate .2s,box-shadow .2s}.ixchip:hover{translate:0 -3px;box-shadow:0 8px 16px rgba(0,0,0,.3)}
.ixchip.drop{animation:chipin .5s cubic-bezier(.2,1.4,.4,1)}
.ixpitch.dragging{animation:pitchglow 1s infinite}.ixbench.dragging{animation:benchglow 1s infinite}

/* пенальти */
.ball{transition:left .45s ease-in,top .45s ease-in,transform .45s ease-in}
.ball.L,.ball.R{transform:translateX(-50%) scale(.65) rotate(720deg)}
.ball:not(.L):not(.R){animation:bob 1.4s ease-in-out infinite}
.keeper:not(.L):not(.R){animation:sway 2.2s ease-in-out infinite}
.stage.goalfx::after{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.7),transparent 70%);animation:flash .6s forwards;pointer-events:none}
.stage.shake{animation:shake .45s}
.gmsg.pop{animation:pop .5s}
.gdots i.n{animation:dotpop .5s}
.cf{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:cf 1.6s ease-in forwards;pointer-events:none}
#gscore{display:inline-block}

/* паки */
.pk:not(.zoom){animation:float 3s ease-in-out infinite}
.pc{animation:cardin .55s var(--ez) both}
.pc:nth-child(2){animation-delay:.08s}.pc:nth-child(3){animation-delay:.16s}.pc:nth-child(4){animation-delay:.24s}.pc:nth-child(5){animation-delay:.32s}
.pc.rare.up .f{animation:rareglow 1.8s infinite}
.pc.leg.up .f{animation:legglow 1.6s infinite}
.mcard.rare{animation:rareglow 1.8s infinite}.mcard.leg{animation:legglow 1.6s infinite}
.coll span:last-child{animation:chipin .45s cubic-bezier(.2,1.4,.4,1)}
#tk{display:inline-block}#tk.bump{animation:bump .4s}
.fl{font-size:20px}
.modal.open{animation:fadein .25s}

/* появление при прокрутке (классы ставит JS) */
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s ease var(--d,0ms),transform .8s var(--ez) var(--d,0ms)}
.rv.in{opacity:1;transform:none}

function shoot(side) {
  if (G.busy || G.over) return;
  G.busy = true; G.msg = '';
  const k = Math.random() < .5 ? 'L' : 'R', goal = k !== side;
  $('#keeper').className = 'keeper ' + k;
  $('#ball').className = 'ball ' + side;
  setTimeout(() => {
    G.res.push(goal); G.r++; if (goal) G.g++;
    G.msg = goal ? 'g_goal' : 'g_save';
    if (G.r === 5) { G.over = true; G.msg = G.g >= 3 ? 'g_win' : 'g_lose'; }
    gUI(); shootFx(goal);
    if (!G.over) setTimeout(() => { G.msg = ''; gReset(false); }, 1100);
  }, 500);
}

    es.forEach(e => {
      if (!e.isIntersecting) return;
      const el = e.target; io.unobserve(el);
      el.style.setProperty('--d', Math.min(n++ * 70, 420) + 'ms');
      requestAnimationFrame(() => el.classList.add('in'));
      setTimeout(() => el.classList.remove('rv', 'in'), 1600);
    });
  }, {threshold: .1, rootMargin: '0px 0px -5% 0px'});
  const reg = root => {
    const list = root.matches && root.matches(SEL) ? [root] : [];
    root.querySelectorAll && root.querySelectorAll(SEL).forEach(x => list.push(x));
    list.forEach(el => { if (el._rv) return; el._rv = 1; el.classList.add('rv'); io.observe(el); });
  };
  reg(document.body);
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => n.nodeType === 1 && reg(n)))).observe(document.body, {childList:true, subtree:true});
})();

// полоса прогресса прокрутки
(function () {
  const bar = $('#prog'); let tick = false;
  addEventListener('scroll', () => {
    if (tick) return; tick = true;
    requestAnimationFrame(() => {
      const h = document.documentElement;
      bar.style.transform = `scaleX(${scrollY / Math.max(1, h.scrollHeight - innerHeight)})`; tick = false;
    });
  }, {passive:true});
})();
</script>
